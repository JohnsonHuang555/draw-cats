<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Lab</title>
    <style>
      body { margin: 0; padding: 16px; background: #07060d; color: #e8e4f0; font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p { margin: 0 0 16px; color: #9a94aa; font-size: 13px; }
      .row { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; }
      #rows { display: flex; flex-wrap: wrap; column-gap: 32px; }
      figure { margin: 0; }
      figcaption { font-size: 12px; color: #9a94aa; margin-bottom: 4px; }
      canvas { width: 256px; height: auto; display: block; }
    </style>
  </head>
  <body>
    <h1>Card Art lab: classic vs inked</h1>
    <p>Dev only, not part of the build. ?all=1 shows every Meme Cat; ?n=1,2,3 picks Generated Cats; ?t=1.5 freezes moving art; ?style=inked shows one style.</p>
    <div id="rows"></div>
    <script type="module" src="/src/artLab.ts"></script>
  </body>
